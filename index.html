<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brasil Colonial: Açúcar, Escravidão e Crise Portuguesa — História · 7º ano</title>
<style>
:root{
  --navy:#0f1a33;  --navy-2:#16244a;  --navy-3:#1e3057;
  --gold:#c8a24a;  --gold-soft:#e0c074;
  --paper:#f4f1e8; --paper-dim:#cdd3df;
  --line:rgba(200,162,74,.28);
  --c-ok:#8fbf6b;  --c-err:#c97b5a;  --c-info:#5b9bd5;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;min-height:100%;background:var(--navy);}
body{
  font-family:-apple-system,"Segoe UI",system-ui,Roboto,sans-serif;
  color:var(--paper);
  background:
    radial-gradient(ellipse at 15% 10%, rgba(200,162,74,.08), transparent 55%),
    radial-gradient(ellipse at 85% 90%, rgba(91,155,213,.06), transparent 55%),
    var(--navy);
  line-height:1.5;
  padding-bottom:64px;
}
h1,h2,h3,.serif{font-family:Georgia,"Times New Roman",serif;}

.container{
  max-width:960px;
  margin:0 auto;
  padding:clamp(24px,4vw,44px) clamp(16px,4vw,32px);
}

/* Header */
header{
  border-bottom:1px solid var(--line);
  padding-bottom:24px;
  margin-bottom:28px;
}
.eyebrow{
  display:flex;
  align-items:center;
  gap:12px;
  text-transform:uppercase;
  letter-spacing:.16em;
  font-size:.72rem;
  color:var(--gold-soft);
  margin-bottom:10px;
}
.eyebrow::before{
  content:"";
  width:30px;
  height:2px;
  background:var(--gold);
  flex:none;
}
h1.main-title{
  font-size:clamp(1.8rem,4vw,2.7rem);
  font-weight:400;
  margin:0 0 10px 0;
  line-height:1.12;
}
h1.main-title .gold{color:var(--gold); font-style:italic;}
.subtitle{
  color:var(--paper-dim);
  font-size:.95rem;
  margin:0;
  max-width:780px;
}

/* Tabs Navigation */
.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:28px;
}
.tab-btn{
  background:var(--navy-2);
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px 16px;
  color:var(--paper-dim);
  text-align:left;
  cursor:pointer;
  transition:all .25s ease;
  display:flex;
  flex-direction:column;
  gap:4px;
  position:relative;
}
.tab-btn:hover{
  background:var(--navy-3);
  border-color:rgba(200,162,74,.55);
}
.tab-btn.active{
  background:linear-gradient(145deg, var(--navy-3), var(--navy-2));
  border:1px solid var(--gold);
  color:var(--paper);
  box-shadow:0 6px 20px rgba(0,0,0,.28);
}
.tab-btn.active::after{
  content:"";
  position:absolute;
  bottom:-1px;
  left:16px;
  right:16px;
  height:3px;
  background:var(--gold);
  border-radius:3px 3px 0 0;
}
.tab-tag{
  font-size:.68rem;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:var(--gold-soft);
}
.tab-title{
  font-family:Georgia,"Times New Roman",serif;
  font-size:1rem;
  line-height:1.25;
}
.tab-score{
  font-size:.75rem;
  color:var(--paper-dim);
  margin-top:4px;
  font-variant-numeric:tabular-nums;
}

/* Scoreboard / Status Bar */
.status-bar{
  background:var(--navy-2);
  border:1px solid var(--line);
  border-radius:12px;
  padding:16px 20px;
  margin-bottom:24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:16px;
}
.status-info h2{
  font-size:1.2rem;
  font-weight:400;
  color:var(--gold-soft);
  margin:0 0 2px 0;
}
.status-info p{
  font-size:.82rem;
  color:var(--paper-dim);
  margin:0;
}
.status-metrics{
  display:flex;
  align-items:center;
  gap:20px;
}
.metric{
  border-left:2px solid var(--gold);
  padding-left:12px;
}
.metric-val{
  font-family:Georgia,serif;
  font-size:1.35rem;
  color:var(--gold-soft);
  display:block;
  line-height:1.1;
  font-variant-numeric:tabular-nums;
}
.metric-lbl{
  font-size:.7rem;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--paper-dim);
}
.btn-reset, .btn-check{
  background:rgba(255,255,255,.05);
  border:1px solid var(--line);
  color:var(--gold-soft);
  padding:9px 15px;
  border-radius:8px;
  font-size:.8rem;
  cursor:pointer;
  transition:all .2s;
  font-family:inherit;
}
.btn-reset:hover{
  background:rgba(200,162,74,.16);
}
.btn-check{
  background:var(--gold);
  color:var(--navy);
  border-color:var(--gold);
  font-weight:600;
  margin-top:14px;
}
.btn-check:hover:not(:disabled){
  background:var(--gold-soft);
}
.btn-check:disabled{
  opacity:.42;
  cursor:not-allowed;
}

/* Section Divider */
.section-head{
  display:flex;
  align-items:center;
  gap:12px;
  margin:34px 0 16px 0;
}
.section-head h3{
  font-size:1.1rem;
  font-weight:400;
  color:var(--gold-soft);
  margin:0;
  white-space:nowrap;
}
.section-head .line{
  height:1px;
  background:var(--line);
  width:100%;
}

/* Question Card */
.q-card{
  background:var(--navy-2);
  border:1px solid var(--line);
  border-radius:12px;
  padding:20px 22px;
  margin-bottom:16px;
  transition:border-color .3s ease;
}
.q-card.answered-ok{border-color:rgba(143,191,107,.55);}
.q-card.answered-partial{border-color:rgba(224,192,116,.55);}
.q-card.answered-err{border-color:rgba(201,123,90,.55);}

.q-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
  gap:10px;
}
.q-num{
  font-size:.72rem;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:var(--gold);
  font-weight:600;
}
.q-badge{
  font-size:.72rem;
  padding:2px 10px;
  border-radius:99px;
  font-weight:600;
  display:none;
}
.q-card.answered-ok .q-badge.ok{display:inline-block; background:rgba(143,191,107,.16); color:var(--c-ok); border:1px solid rgba(143,191,107,.4);}
.q-card.answered-partial .q-badge.partial{display:inline-block; background:rgba(224,192,116,.16); color:var(--gold-soft); border:1px solid rgba(224,192,116,.4);}
.q-card.answered-err .q-badge.err{display:inline-block; background:rgba(201,123,90,.16); color:var(--c-err); border:1px solid rgba(201,123,90,.4);}

.q-text{
  font-size:.98rem;
  color:var(--paper);
  margin:0 0 16px 0;
}

/* MC Options */
.options-list{
  display:flex;
  flex-direction:column;
  gap:9px;
}
.opt-btn{
  background:rgba(15,26,51,.65);
  border:1px solid rgba(205,211,223,.2);
  border-radius:8px;
  padding:11px 14px;
  color:var(--paper);
  font-size:.9rem;
  text-align:left;
  cursor:pointer;
  display:flex;
  align-items:flex-start;
  gap:11px;
  transition:all .2s ease;
  font-family:inherit;
  line-height:1.4;
}
.opt-btn:hover:not(:disabled){
  background:var(--navy-3);
  border-color:var(--gold);
}
.opt-btn:disabled{
  cursor:default;
}
.opt-letter{
  font-family:Georgia,serif;
  font-weight:bold;
  color:var(--gold-soft);
  min-width:22px;
  height:22px;
  border-radius:50%;
  border:1px solid var(--line);
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:.78rem;
  flex:none;
  margin-top:1px;
}

/* States after answering */
.opt-btn.correct{
  background:rgba(143,191,107,.18);
  border-color:var(--c-ok);
  color:#eef7e6;
}
.opt-btn.correct .opt-letter{
  background:var(--c-ok);
  color:var(--navy);
  border-color:var(--c-ok);
}
.opt-btn.wrong{
  background:rgba(201,123,90,.18);
  border-color:var(--c-err);
  color:#fbe9e2;
}
.opt-btn.wrong .opt-letter{
  background:var(--c-err);
  color:var(--navy);
  border-color:var(--c-err);
}
.opt-btn.dimmed{
  opacity:.52;
}

/* Compound V/F Rows (4 items per question) */
.vf-group{
  display:flex;
  flex-direction:column;
  gap:10px;
}
.vf-row{
  background:rgba(15,26,51,.65);
  border:1px solid rgba(205,211,223,.18);
  border-radius:8px;
  padding:11px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  transition:all .2s ease;
}
.vf-row.row-ok{
  border-color:rgba(143,191,107,.65);
  background:rgba(143,191,107,.1);
}
.vf-row.row-err{
  border-color:rgba(201,123,90,.65);
  background:rgba(201,123,90,.1);
}
.vf-stmt{
  font-size:.89rem;
  color:var(--paper);
  line-height:1.42;
  flex:1;
}
.vf-stmt .roman{
  font-family:Georgia,serif;
  color:var(--gold-soft);
  font-weight:bold;
  margin-right:6px;
}
.vf-toggles{
  display:flex;
  gap:6px;
  flex:none;
}
.vf-pill{
  width:38px;
  height:32px;
  border-radius:6px;
  border:1px solid rgba(205,211,223,.25);
  background:var(--navy-2);
  color:var(--paper-dim);
  font-family:Georgia,serif;
  font-weight:bold;
  font-size:.82rem;
  cursor:pointer;
  transition:all .18s ease;
}
.vf-pill:hover:not(:disabled){
  border-color:var(--gold);
  color:var(--paper);
}
.vf-pill.selected{
  background:var(--gold);
  color:var(--navy);
  border-color:var(--gold);
}
.vf-pill.res-correct{
  background:var(--c-ok);
  color:var(--navy);
  border-color:var(--c-ok);
}
.vf-pill.res-wrong{
  background:var(--c-err);
  color:var(--navy);
  border-color:var(--c-err);
}
.vf-pill:disabled{
  cursor:default;
}
.vf-ans-tag{
  font-size:.74rem;
  font-weight:600;
  margin-left:6px;
  white-space:nowrap;
}
.vf-ans-tag.ok{color:var(--c-ok);}
.vf-ans-tag.err{color:var(--c-err);}

/* Column Matching Questions */
.match-layout{
  display:grid;
  grid-template-columns:1fr 1.25fr;
  gap:16px;
  align-items:start;
}
.match-col-a{
  background:rgba(15,26,51,.55);
  border:1px solid var(--line);
  border-radius:8px;
  padding:12px 14px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.match-col-title{
  font-size:.72rem;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:var(--gold-soft);
  border-bottom:1px solid var(--line);
  padding-bottom:6px;
  margin-bottom:2px;
}
.col-a-item{
  font-size:.88rem;
  line-height:1.38;
  display:flex;
  gap:8px;
  align-items:flex-start;
}
.col-a-badge{
  font-family:Georgia,serif;
  font-weight:bold;
  color:var(--navy);
  background:var(--gold-soft);
  min-width:22px;
  height:22px;
  border-radius:5px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  font-size:.78rem;
  flex:none;
  margin-top:1px;
}
.match-col-b{
  display:flex;
  flex-direction:column;
  gap:9px;
}
.match-row{
  background:rgba(15,26,51,.65);
  border:1px solid rgba(205,211,223,.18);
  border-radius:8px;
  padding:10px 12px;
  display:flex;
  align-items:center;
  gap:10px;
  transition:all .2s ease;
}
.match-row.row-ok{
  border-color:rgba(143,191,107,.65);
  background:rgba(143,191,107,.1);
}
.match-row.row-err{
  border-color:rgba(201,123,90,.65);
  background:rgba(201,123,90,.1);
}
.match-select{
  background:var(--navy-2);
  border:1px solid var(--gold);
  color:var(--gold-soft);
  border-radius:6px;
  padding:5px 8px;
  font-family:Georgia,serif;
  font-weight:bold;
  font-size:.85rem;
  cursor:pointer;
  flex:none;
}
.match-select:disabled{
  opacity:.9;
  cursor:default;
}
.match-row.row-ok .match-select{
  border-color:var(--c-ok);
  color:var(--c-ok);
}
.match-row.row-err .match-select{
  border-color:var(--c-err);
  color:var(--c-err);
}
.match-desc{
  font-size:.87rem;
  color:var(--paper);
  line-height:1.38;
  flex:1;
}

/* Feedback box */
.feedback{
  margin-top:14px;
  padding:12px 15px;
  border-radius:8px;
  font-size:.86rem;
  line-height:1.5;
  display:none;
  border-left:3px solid var(--gold);
  background:rgba(15,26,51,.75);
  color:var(--paper-dim);
}
.feedback.show{display:block; animation:fadeIn .25s ease;}
.feedback strong{color:var(--gold-soft);}

/* Final Summary Banner */
.summary-box{
  margin-top:28px;
  background:linear-gradient(135deg, var(--navy-2), var(--navy-3));
  border:1px solid var(--gold);
  border-radius:12px;
  padding:22px 24px;
  display:none;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:16px;
}
.summary-box.show{display:flex;}
.summary-box h4{
  font-size:1.25rem;
  font-weight:400;
  color:var(--gold-soft);
  margin:0 0 4px 0;
}
.summary-box p{
  margin:0;
  font-size:.9rem;
  color:var(--paper-dim);
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(4px);}
  to{opacity:1; transform:translateY(0);}
}

@media (max-width:740px){
  .tabs{grid-template-columns:1fr;}
  .match-layout{grid-template-columns:1fr;}
  .status-bar{flex-direction:column; align-items:flex-start;}
  .vf-row{flex-direction:column; align-items:flex-start;}
}
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="eyebrow">7º ano · História · Exercícios Interativos</div>
    <h1 class="main-title">Brasil Colonial: <span class="gold">Açúcar, Escravidão e Crise</span></h1>
    <p class="subtitle">Selecione o tema trabalhado na aula. Cada aba contém <strong>18 questões</strong>: 10 de múltipla escolha (A–D), 5 de Verdadeiro ou Falso composto (4 itens cada) e 3 de associação entre colunas.</p>
  </header>

  <nav class="tabs" id="tabs-nav" role="tablist">
    <button class="tab-btn active" data-tab="0" role="tab" aria-selected="true">
      <span class="tab-tag">Unidade 5 · Tema 4</span>
      <span class="tab-title">Açúcar: o principal negócio da Colônia</span>
      <span class="tab-score" id="tab-score-0">0 / 18 concluídas</span>
    </button>
    <button class="tab-btn" data-tab="1" role="tab" aria-selected="false">
      <span class="tab-tag">Unidade 6 · Tema 3</span>
      <span class="tab-title">A escravidão africana no Brasil</span>
      <span class="tab-score" id="tab-score-1">0 / 18 concluídas</span>
    </button>
    <button class="tab-btn" data-tab="2" role="tab" aria-selected="false">
      <span class="tab-tag">Unidade 7 · Tema 2</span>
      <span class="tab-title">A crise e a dependência portuguesa</span>
      <span class="tab-score" id="tab-score-2">0 / 18 concluídas</span>
    </button>
  </nav>

  <div id="quiz-workspace"></div>
</div>

<script>
const QUIZ_DATA = [
  {
    id: 0,
    unit: "Unidade 5 · Tema 4",
    title: "Açúcar: o principal negócio da Colônia",
    desc: "Organização da produção açucareira, estrutura dos engenhos e sociedade colonial.",
    mc: [
      {
        q: "Por que o cultivo da cana-de-açúcar obteve maior sucesso na faixa litorânea do Nordeste brasileiro, especialmente em Pernambuco e na Bahia?",
        opts: [
          "Pela combinação entre o clima tropical quente e úmido, o solo fértil de massapê e a menor distância marítima até a Europa.",
          "Pela presença de grandes rios navegáveis que ligavam o litoral diretamente às minas de ouro do interior.",
          "Porque a região possuía mão de obra assalariada europeia abundante e terras divididas em pequenas propriedades familiares.",
          "Porque o clima semiárido do sertão nordestino impedia pragas agrícolas e dispensava o uso de chuvas regulares."
        ],
        ans: 0,
        exp: "O solo escuro e muito fértil chamado massapê, aliado ao clima quente e úmido e à proximidade dos portos europeus (barateando o transporte), garantiu o sucesso dos engenhos em Pernambuco e na Bahia."
      },
      {
        q: "Sobre o papel dos comerciantes e banqueiros holandeses (flamengos) no negócio do açúcar brasileiro durante o século XVI, é correto afirmar que eles:",
        opts: [
          "Proibiam a entrada do açúcar português na Europa para proteger suas próprias plantações na Ásia.",
          "Controlavam exclusivamente o trabalho agrícola nos canaviais de São Vicente e do Rio de Janeiro.",
          "Financiavam a montagem dos engenhos, refinavam o açúcar bruto na Europa e o distribuíam no mercado europeu.",
          "Eram responsáveis apenas pela captura de indígenas no interior do Brasil para vendê-los aos senhores de engenho."
        ],
        ans: 2,
        exp: "Como Portugal não tinha capital suficiente nem estrutura de refino, estabeleceu uma parceria com os holandeses, que financiavam equipamentos, refinavam o açúcar e o distribuíam na Europa."
      },
      {
        q: "Na estrutura física de um engenho colonial, qual era a função específica da 'casa de purgar'?",
        opts: [
          "Servir de moradia fortificada para o senhor de engenho, sua família e os padres capelães.",
          "Branquear e secar o açúcar já cozido em formas de barro, separando o melado das impurezas.",
          "Moer a cana recém-colhida utilizando a força da água ou de bois para extrair o caldo.",
          "Alojar os trabalhadores escravizados durante a noite sob vigilância constante dos feitores."
        ],
        ans: 1,
        exp: "Após a moenda (extração do caldo) e a casa das caldeiras (fervura), o açúcar ia para a casa de purgar, onde era colocado em formas cônicas para branquear e secar."
      },
      {
        q: "A sociedade açucareira colonial era marcada pelo poder patriarcal dos senhores de engenho. Isso significa que o senhor de engenho:",
        opts: [
          "Dividia as decisões políticas da vila em igualdade de condições com os lavradores e os artesãos.",
          "Submetia-se diariamente às ordens diretas do mestre de açúcar e dos capitães do mato.",
          "Não possuía influência fora de suas terras, pois as Câmaras Municipais eram controladas pelos escravizados libertos.",
          "Concentrava autoridade máxima sobre familiares, agregados e escravizados, além de dominar a política local nas Câmaras Municipais."
        ],
        ans: 3,
        exp: "O senhor de engenho exercia poder econômico, social e político (como 'homem bom' nas Câmaras Municipais), concentrando autoridade patriarcal na casa-grande."
      },
      {
        q: "Quem eram os 'lavradores de cana' na sociedade do engenho colonial?",
        opts: [
          "Produtores livres que cultivavam cana em terras próprias ou arrendadas, mas precisavam moê-la no engenho de um senhor em troca de parte da produção.",
          "Trabalhadores africanos recém-chegados que recebiam pequenas parcelas de terra após cinco anos de serviço.",
          "Funcionários enviados pelo rei de Portugal para cobrar o quinto sobre cada caixa de açúcar embarcada.",
          "Comerciantes holandeses que moravam na casa-grande para fiscalizar a qualidade do açúcar branco."
        ],
        ans: 0,
        exp: "Os lavradores de cana eram homens livres (proprietários de pequenas terras ou arrendatários) que não tinham recursos para montar um engenho próprio e entregavam parte do açúcar ao senhor pela moagem."
      },
      {
        q: "Entre os trabalhadores livres e assalariados do engenho, qual profissional era considerado o mais importante e bem remunerado, sendo tratado com grande respeito pelo senhor?",
        opts: [
          "O feitor, encarregado de vigiar os escravizados e aplicar castigos físicos.",
          "O barqueiro, responsável por levar as caixas de açúcar até os navios no porto.",
          "O mestre de açúcar, que controlava o ponto exato do cozimento do caldo e a qualidade final do produto.",
          "O ferreiro, que consertava os eixos dos carros de boi e as ferramentas do canavial."
        ],
        ans: 2,
        exp: "O mestre de açúcar dominava a técnica mais delicada da produção: saber o momento exato de retirar o caldo das caldeiras para que o açúcar cristalizasse sem queimar."
      },
      {
        q: "Sobre o modelo econômico conhecido como 'plantation', adotado na produção açucareira colonial, assinale a alternativa que reúne suas quatro características básicas:",

// mc: Array(10).fill(null)
// vf: Array(5).fill({ choices: [null, null, null, null], submitted: false })
// match: Array(3).fill({ choices: [null, null, null, null], submitted: false })
const state = QUIZ_DATA.map(() => ({
  mc: Array(10).fill(null),
  vf: Array.from({ length: 5 }, () => ({ choices: [null, null, null, null], submitted: false })),
  match: Array.from({ length: 3 }, () => ({ choices: [null, null, null, null], submitted: false }))
}));

let currentTab = 0;

function computeTopicStats(tabIdx) {
  const topic = QUIZ_DATA[tabIdx];
  const s = state[tabIdx];

  let completedQuestions = 0;
  let totalPoints = 0;
  // Max points per tab: 10 (MC: 1 pt each) + 5*4 (VF: 4 items each = 20) + 3*4 (Match: 4 items each = 12) = 42 itens avaliados
  // Or also track question-level completion (out of 18)
  const maxItems = 10 + (5 * 4) + (3 * 4); // 42

  s.mc.forEach((v, i) => {
    if (v !== null) {
      completedQuestions++;
      if (v === topic.mc[i].ans) totalPoints++;
    }
  });

  s.vf.forEach((qState, i) => {
    if (qState.submitted) {
      completedQuestions++;
      qState.choices.forEach((c, idx) => {
        if (c === topic.vf[i].items[idx].ans) totalPoints++;
      });
    }
  });

  s.match.forEach((qState, i) => {
    if (qState.submitted) {
      completedQuestions++;
      qState.choices.forEach((c, idx) => {
        if (c === topic.match[i].colB[idx].ans) totalPoints++;
      });
    }
  });

  return { completedQuestions, totalPoints, maxItems };
}

function updateTabCounters() {
  QUIZ_DATA.forEach((_, idx) => {
    const { completedQuestions, totalPoints, maxItems } = computeTopicStats(idx);
    const el = document.getElementById(`tab-score-${idx}`);
    if (completedQuestions === 0) {
      el.textContent = "0 / 18 concluídas";
    } else {
      el.textContent = `${completedQuestions}/18 quest. · ${totalPoints}/${maxItems} itens`;
    }
  });
}

  currentTab = tabIdx;
  document.querySelectorAll(".tab-btn").forEach((btn, idx) => {

    btn.classList.toggle("active", active);
    btn.setAttribute("aria-selected", active ? "true" : "false");

  const pct = answeredItemsCount > 0 ? Math.round((totalPoints / answeredItemsCount) * 100) : 0;
  const letters = ["A", "B", "C", "D"];
  const romans = ["I.", "II.", "III.", "IV."];

          <span class="metric-val">${completedQuestions}/18</span>
          <span class="metric-lbl">Questões</span>
        </div>
        <div class="metric">
          <span class="metric-val">${totalPoints}/${maxItems}</span>
          <span class="metric-lbl">Itens (${pct}%)</span>
        </div>
        <button class="btn-reset" onclick="resetCurrentTab()">Reiniciar aba</button>
      </div>
    </div>

    <div class="section-head">
      <h3>Parte I · Múltipla Escolha (Questões 01 a 10)</h3>
      <div class="line"></div>
    </div>
  `;

  // 1. Múltipla Escolha
  topic.mc.forEach((item, qIdx) => {
    const chosen = s.mc[qIdx];
    const isAnswered = chosen !== null;
    const isCorrect = isAnswered && chosen === item.ans;
    const cardState = !isAnswered ? "" : (isCorrect ? "answered-ok" : "answered-err");

    html += `
      <article class="q-card ${cardState}">
        <div class="q-header">
          <span class="q-num">Questão ${String(qIdx + 1).padStart(2, "0")} · Múltipla Escolha</span>
          <span class="q-badge ok">✓ Resposta correta</span>
          <span class="q-badge err">✕ Resposta incorreta</span>
        </div>
        <p class="q-text">${item.q}</p>
        <div class="options-list">
          ${item.opts.map((optText, oIdx) => {
            let cls = "opt-btn";
            if (isAnswered) {
              if (oIdx === item.ans) cls += " correct";
              else if (oIdx === chosen) cls += " wrong";
              else cls += " dimmed";
            }
            return `
              <button class="${cls}" ${isAnswered ? "disabled" : ""} onclick="answerMc(${qIdx}, ${oIdx})">
                <span class="opt-letter">${letters[oIdx]}</span>
                <span>${optText}</span>
              </button>
            `;
          }).join("")}
        </div>
        <div class="feedback ${isAnswered ? "show" : ""}">
          <strong>Comentário:</strong> ${item.exp}
        </div>
      </article>
    `;
  });

  // 2. Verdadeiro ou Falso Composto (4 itens por questão)
  html += `
    <div class="section-head">
      <h3>Parte II · Verdadeiro ou Falso Composto — 4 itens por questão (Questões 11 a 15)</h3>
      <div class="line"></div>
    </div>
  `;

  topic.vf.forEach((item, qIdx) => {
    const qState = s.vf[qIdx];
    const allFilled = qState.choices.every(c => c !== null);
    let hits = 0;
    if (qState.submitted) {
      qState.choices.forEach((c, idx) => { if (c === item.items[idx].ans) hits++; });
    }
    const cardState = !qState.submitted ? "" : (hits === 4 ? "answered-ok" : (hits >= 2 ? "answered-partial" : "answered-err"));

    html += `
      <article class="q-card ${cardState}">
        <div class="q-header">
          <span class="q-num">Questão ${String(qIdx + 11).padStart(2, "0")} · Verdadeiro ou Falso (4 itens)</span>
          <span class="q-badge ok">✓ 4/4 itens corretos</span>
          <span class="q-badge partial">◐ ${hits}/4 itens corretos</span>
          <span class="q-badge err">✕ ${hits}/4 itens corretos</span>
        </div>
        <p class="q-text">${item.q}</p>
        <div class="vf-group">
          ${item.items.map((sub, iIdx) => {
            const val = qState.choices[iIdx];
            const isSubOk = qState.submitted && val === sub.ans;
            const rowCls = !qState.submitted ? "" : (isSubOk ? "row-ok" : "row-err");

            let btnVCls = "vf-pill";
            let btnFCls = "vf-pill";
            if (!qState.submitted) {
              if (val === "V") btnVCls += " selected";
              if (val === "F") btnFCls += " selected";
            } else {
              if (sub.ans === "V") btnVCls += " res-correct";
              else if (val === "V") btnVCls += " res-wrong";

              if (sub.ans === "F") btnFCls += " res-correct";
              else if (val === "F") btnFCls += " res-wrong";
            }

            return `
              <div class="vf-row ${rowCls}">
                <div class="vf-stmt">
                  <span class="roman">${romans[iIdx]}</span>${sub.text}
                  ${qState.submitted ? `<span class="vf-ans-tag ${isSubOk ? "ok" : "err"}">${isSubOk ? "✓ Correto" : `✕ Gabarito: ${sub.ans}`}</span>` : ""}
                </div>
                <div class="vf-toggles">
                  <button class="${btnVCls}" ${qState.submitted ? "disabled" : ""} onclick="selectVfItem(${qIdx}, ${iIdx}, 'V')">V</button>
                  <button class="${btnFCls}" ${qState.submitted ? "disabled" : ""} onclick="selectVfItem(${qIdx}, ${iIdx}, 'F')">F</button>
                </div>
              </div>
            `;
          }).join("")}
        </div>
        ${!qState.submitted ? `
          <button class="btn-check" ${!allFilled ? "disabled" : ""} onclick="submitVf(${qIdx})">
            ${allFilled ? "Verificar respostas" : "Marque V ou F nos 4 itens para verificar"}
          </button>
        ` : ""}
        <div class="feedback ${qState.submitted ? "show" : ""}">
          <strong>Comentário:</strong> ${item.exp}
        </div>
      </article>
    `;
  });

  // 3. Associação entre Colunas (3 questões)
  html += `
    <div class="section-head">
      <h3>Parte III · Associação entre Colunas (Questões 16 a 18)</h3>
      <div class="line"></div>
    </div>
  `;

  topic.match.forEach((item, qIdx) => {
    const qState = s.match[qIdx];
    const allFilled = qState.choices.every(c => c !== null && c !== "");
    let hits = 0;
    if (qState.submitted) {
      qState.choices.forEach((c, idx) => { if (c === item.colB[idx].ans) hits++; });
    }
    const cardState = !qState.submitted ? "" : (hits === 4 ? "answered-ok" : (hits >= 2 ? "answered-partial" : "answered-err"));

    html += `
      <article class="q-card ${cardState}">
        <div class="q-header">
          <span class="q-num">Questão ${String(qIdx + 16).padStart(2, "0")} · Associação de Colunas</span>
          <span class="q-badge ok">✓ 4/4 associações corretas</span>
          <span class="q-badge partial">◐ ${hits}/4 associações corretas</span>
          <span class="q-badge err">✕ ${hits}/4 associações corretas</span>
        </div>
        <p class="q-text">${item.q}</p>
        <div class="match-layout">
          <div class="match-col-a">
            <div class="match-col-title">Coluna A · Conceitos / Eventos</div>
            ${item.colA.map(ca => `
              <div class="col-a-item">
                <span class="col-a-badge">${ca.id}</span>
                <span>${ca.text}</span>
              </div>
            `).join("")}
          </div>
          <div class="match-col-b">
            <div class="match-col-title">Coluna B · Relacione a letra correspondente</div>
            ${item.colB.map((cb, rIdx) => {
              const chosen = qState.choices[rIdx] || "";
              const isRowOk = qState.submitted && chosen === cb.ans;
              const rowCls = !qState.submitted ? "" : (isRowOk ? "row-ok" : "row-err");
              return `
                <div class="match-row ${rowCls}">
                  <select class="match-select" aria-label="Selecionar letra para o item ${rIdx + 1}" ${qState.submitted ? "disabled" : ""} onchange="selectMatchItem(${qIdx}, ${rIdx}, this.value)">
                    <option value="" ${chosen === "" ? "selected" : ""}>( ? )</option>
                    ${item.colA.map(ca => `<option value="${ca.id}" ${chosen === ca.id ? "selected" : ""}>( ${ca.id} )</option>`).join("")}
                  </select>
                  <div class="match-desc">
                    ${cb.text}
                    ${qState.submitted ? `<span class="vf-ans-tag ${isRowOk ? "ok" : "err"}">${isRowOk ? "✓ Correto" : `✕ Gabarito: (${cb.ans})`}</span>` : ""}
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        </div>
        ${!qState.submitted ? `
          <button class="btn-check" ${!allFilled ? "disabled" : ""} onclick="submitMatch(${qIdx})">
            ${allFilled ? "Verificar associações" : "Preencha as 4 associações para verificar"}
          </button>
        ` : ""}
        <div class="feedback ${qState.submitted ? "show" : ""}">
          <strong>Comentário:</strong> ${item.exp}
        </div>
      </article>
    `;
  });

  const finished = completedQuestions === 18;
  let perfMsg = "";
  if (finished) {
    if (pct >= 85) perfMsg = "Excelente desempenho! Você domina todos os formatos de questão deste tema para a prova.";
    else if (pct >= 65) perfMsg = "Bom resultado! Revise os comentários dos itens em que houve erro para consolidar o conteúdo.";
    else perfMsg = "Vale a pena reler o esquema visual da aula e refazer esta bateria de exercícios.";
  }

  html += `
    <div class="summary-box ${finished ? "show" : ""}">
      <div>
        <h4>Tema concluído: ${totalPoints} de ${maxItems} itens corretos (${pct}%)</h4>
        <p>${perfMsg}</p>
      </div>
      <button class="btn-reset" onclick="resetCurrentTab()">Refazer este tema</button>
    </div>
  `;

  document.getElementById("quiz-workspace").innerHTML = html;
  updateTabCounters();
}

window.answerMc = function(qIdx, oIdx) {
  if (state[currentTab].mc[qIdx] !== null) return;
  state[currentTab].mc[qIdx] = oIdx;
  renderTab(currentTab);
};

window.selectVfItem = function(qIdx, iIdx, val) {
  if (state[currentTab].vf[qIdx].submitted) return;
  state[currentTab].vf[qIdx].choices[iIdx] = val;
  renderTab(currentTab);
};

window.submitVf = function(qIdx) {
  const qState = state[currentTab].vf[qIdx];
  if (qState.submitted || qState.choices.some(c => c === null)) return;
  qState.submitted = true;
  renderTab(currentTab);
};

window.selectMatchItem = function(qIdx, rIdx, val) {
  if (state[currentTab].match[qIdx].submitted) return;
  state[currentTab].match[qIdx].choices[rIdx] = val === "" ? null : val;
  renderTab(currentTab);
};

window.submitMatch = function(qIdx) {
  const qState = state[currentTab].match[qIdx];
  if (qState.submitted || qState.choices.some(c => c === null || c === "")) return;
  qState.submitted = true;
  renderTab(currentTab);
};

window.resetCurrentTab = function() {
  state[currentTab] = {
    mc: Array(10).fill(null),
    vf: Array.from({ length: 5 }, () => ({ choices: [null, null, null, null], submitted: false })),
    match: Array.from({ length: 3 }, () => ({ choices: [null, null, null, null], submitted: false }))
  };
  renderTab(currentTab);
};

document.querySelectorAll(".tab-btn").forEach((btn, idx) => {
  btn.addEventListener("click", () => renderTab(idx));
});

renderTab(0);
</script>
</body>
</html>
